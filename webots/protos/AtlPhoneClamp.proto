# template language: javascript
# A commercial phone holder, generic until the real one is measured: a round base with a neck and a ball joint, a cradle
# leaning back by `tilt`, a lip under the phone and two spring arms that grip its sides (55-90 mm). Its origin is the
# seat: where the bottom edge of the phone's screen rests, untilted; the base sits `neck` below it. AtlOmiStack embeds
# it on its brick riser; the phone (AtlPhone) rides on it, placed by its controller from the same fields. The phone's
# mass is a ballast here (no shape, no contact), so the robot carries it: the phone itself is moved, not simulated.

PROTO AtlPhoneClamp [
  field SFVec3f    translation  0 0 0
  field SFRotation rotation     0 0 1 0
  field SFString   name         "phone clamp"
  field SFFloat    tilt         0.26      # rad the screen leans back (about 15 degrees)
  field SFFloat    width        0.0712    # the phone's width: the arms open to it (0.055-0.090)
  field SFFloat    thickness    0.0074    # the phone's thickness
  field SFFloat    height       0.1486    # the phone's height (for its ballast)
  field SFFloat    armAt        0.06      # the arms' height above the phone's bottom edge: clear of its side buttons
  field SFFloat    neck         0.024     # from the base's bottom up to the seat
  field SFFloat    phoneMass    0.145     # kg, carried as a ballast at the phone's centre
  field SFFloat    mass         0.06      # kg, the holder itself (estimated)
]
{
  %<
    const t = fields.tilt.value, d = fields.thickness.value, h = fields.height.value, a = fields.armAt.value;
    const w = Math.min(0.09, Math.max(0.055, fields.width.value)), neck = fields.neck.value;
    const c = Math.cos(t), s = Math.sin(t);
    // the cradle's frame: x' the screen's normal, z' up the phone; the ball sits behind the phone's bottom
    const bx = c * (-d - 0.009) - s * 0.012, bz = s * (-d - 0.009) + c * 0.012;
    const px = c * (-d / 2) - s * (h / 2), pz = s * (-d / 2) + c * (h / 2);   // the phone's centre
    const lo = -d - 0.005, hi = 0.002, armY = w / 2 + 0.005, inner = 0.022;
  >%
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name
    children [
      Pose {  # the base and the neck, upright
        translation %<= bx >% 0 0
        children [
          Pose { translation 0 0 %<= -neck + 0.003 >% children [
            Shape { appearance DEF CLAMP_DARK PBRAppearance { baseColor 0.12 0.12 0.13 roughness 0.5 metalness 0 }
                    geometry Cylinder { height 0.006 radius 0.018 subdivision 24 } } ] }
          Pose { translation 0 0 %<= (-neck + 0.006 + bz) / 2 >% children [
            Shape { appearance USE CLAMP_DARK geometry Cylinder { height %<= bz + neck - 0.006 >% radius 0.0045 subdivision 12 } } ] }
        ]
      }
      Pose {  # the cradle, leaning back
        rotation 0 1 0 %<= -t >%
        children [
          Pose { translation %<= -d - 0.009 >% 0 0.012 children [
            Shape { appearance USE CLAMP_DARK geometry Sphere { radius 0.008 subdivision 2 } } ] }
          Pose { translation %<= -d - 0.0025 >% 0 0.05 children [
            Shape { appearance USE CLAMP_DARK geometry Box { size 0.005 0.044 0.1 } } ] }
          Pose { translation %<= (lo + hi) / 2 >% 0 -0.002 children [
            Shape { appearance USE CLAMP_DARK geometry Box { size %<= hi - lo >% 0.04 0.004 } } ] }
          Pose { translation 0.001 0 0.001 children [
            Shape { appearance USE CLAMP_DARK geometry Box { size 0.002 0.04 0.006 } } ] }
          %< for (const side of [-1, 1]) { >%
            Pose { translation %<= -d - 0.003 >% %<= side * (inner + armY) / 2 >% %<= a >% children [
              Shape { appearance DEF CLAMP_ARM PBRAppearance { baseColor 0.78 0.79 0.8 roughness 0.3 metalness 0.4 }
                      geometry Box { size 0.006 %<= armY - inner >% 0.012 } } ] }
            Pose { translation %<= -d / 2 >% %<= side * (w / 2 + 0.002) >% %<= a >% children [
              Shape { appearance DEF CLAMP_PAD PBRAppearance { baseColor 0.2 0.2 0.22 roughness 0.9 metalness 0 }
                      geometry Box { size %<= d + 0.008 >% 0.004 0.016 } } ] }
            Pose { translation 0.001 %<= side * (w / 2 - 0.0005) >% %<= a >% children [
              Shape { appearance USE CLAMP_PAD geometry Box { size 0.002 0.005 0.016 } } ] }
          %< } >%
        ]
      }
      Solid {  # the phone's mass, at its centre: no shape, no contact
        translation %<= px >% 0 %<= pz >%
        name "phone ballast"
        physics Physics { density -1 mass IS phoneMass centerOfMass [ 0 0 0 ] inertiaMatrix [ 0.0003 0.0003 0.00008 0 0 0 ] }
      }
    ]
    boundingObject Pose { translation %<= bx >% 0 %<= -neck + 0.003 >% children [ Cylinder { height 0.006 radius 0.018 } ] }
    physics Physics { density -1 mass IS mass }
  }
}
