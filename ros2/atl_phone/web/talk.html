<!-- Übersetzen's guest page: a second phone on the home Wi-Fi talks with Omi's robot, German <-> French. Opened from
     the QR code on the robot's phone (https, the bridge's guest port, ?k=the guest code); ?lang=en|fr|de for its words. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Omi · Übersetzen</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
               font: 16px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; gap: 10px; }
  h1 { margin: 0; font: 700 clamp(20px, 6vw, 28px) system-ui, sans-serif; }
  #status { display: none; padding: 10px 12px; border-radius: 12px; background: #3a300f; border: 2px solid #ffcc33; }
  #cert { margin: 0; color: #9a9a93; font-size: 13px; }
  #talk { flex: 1; display: flex; gap: 12px; min-height: 0; }
  #talk .half { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 12px 10px; border-radius: 18px;
                border: 3px solid #3fd8ff; background: rgba(63, 216, 255, 0.1); color: #fff; touch-action: none;
                user-select: none; -webkit-user-select: none; overflow: hidden; }
  #talk .half[data-l="fr"] { border-color: #ffcc33; background: rgba(255, 204, 51, 0.1); }
  #talk .half.on { background: #d02020; border-color: #fff; }
  #talk b { font: 700 clamp(20px, 6.5vw, 32px) system-ui, sans-serif; }
  #talk small { font: 500 clamp(14px, 4vw, 18px) system-ui, sans-serif; color: #bcd; }
  #talk .heard { margin: 0; font: 500 clamp(14px, 4vw, 18px)/1.3 system-ui, sans-serif; color: #bcd; overflow-wrap: anywhere; }
  #talk .said { margin: 0; flex: 1; overflow: auto; font: 700 clamp(20px, 6.5vw, 32px)/1.25 system-ui, sans-serif; overflow-wrap: anywhere; }
  #listening { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); border-radius: 8px; padding: 4px 12px;
               background: #d02020; color: #fff; font: 700 18px system-ui, sans-serif; display: none; z-index: 5; }
  #toast { position: fixed; left: 12px; right: 12px; top: 56px; z-index: 3; display: none; padding: 14px 16px; border-radius: 18px;
           background: rgba(0, 0, 0, 0.9); border: 3px solid #3fd8ff; text-align: center;
           font: 700 clamp(18px, 5.5vw, 28px)/1.25 system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<h1 id="title">Omi</h1>
<div id="status"></div>
<div id="talk"></div>
<p id="cert"></p>
<div id="listening"></div>
<div id="toast"></div>
<script src="texts.js"></script>
<script src="guest.js"></script>
<script src="talk.js"></script>
</body>
</html>
