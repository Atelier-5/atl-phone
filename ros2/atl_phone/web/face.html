<!-- The robot's face: eyes on the whole screen, or in portrait (?layout=portrait|auto) eyes on top and a panel
     below (a mouth, a pad of buttons, a camera's picture, the sensors; a tap on the eyes opens the menu); the phone's
     senses, and what its camera finds (see.js), go to the bridge (contract atl-phone/0.5). The helpers (omi.js) run here:
     the time, the magnifier, reading aloud, "what is this?", showing the picture to the PC (only when allowed).
     face.html?offline=1&expression=happy&still=1 draws one expression without a bridge (for pictures);
     ?panel=mouth|pad|off|camera|camera_back|sensors|magnify starts with that panel; ?style=tiles the big spoken menu; ?autostart=1 skips the start tap; ?key=... when the bridge has a pairing key; ?lang=en|fr|de. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/eye-192.png">
<title>Robot face</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none;
               -webkit-user-select: none; user-select: none; }
  /* sized by face.js to the window as it is (100vh is taller than what shows while Chrome's bars are there) */
  canvas { display: block; width: 100vw; height: 100vh; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: 16px; background: #000; color: #ddd; font: 18px/1.4 system-ui, sans-serif; text-align: center; padding: 16px; }
  #start button { font: inherit; font-size: 1.3em; padding: 14px 32px; border-radius: 12px; border: 0;
                  background: #3fd8ff; color: #000; }
  #start small { color: #888; max-width: 30em; }
  .dot { position: fixed; top: 8px; width: 10px; height: 10px; border-radius: 50%; }
  #link { left: 8px; background: #b3261e; }
  #link.on { background: #1f7a3f; }
  /* a camera is on (torch, test: ● cam; look: ● look): the face says so, always */
  #eye { right: 8px; width: auto; height: auto; border-radius: 6px; padding: 2px 6px; background: #e0b341; color: #000;
         font: 12px system-ui, sans-serif; display: none; }
  /* the setup page's camera test: what the camera sees, on the phone only */
  #view { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 46vw; max-height: 76vh; object-fit: cover;
          border: 3px solid #e0b341; border-radius: 12px; display: none; pointer-events: none; background: #222; }
  /* portrait: the panel under the eyes */
  #panel { position: fixed; left: 0; right: 0; bottom: 0; display: none; align-items: stretch; justify-content: center;
           padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; }
  #pad { flex: 1; display: none; gap: 12px; grid-auto-rows: 1fr; }
  #pad button { font: 600 clamp(18px, 6vw, 34px) system-ui, sans-serif; border: 3px solid; border-radius: 18px;
                touch-action: none; transition: transform 0.08s; overflow: hidden; text-overflow: ellipsis; }
  #pad button.down { transform: scale(0.94); filter: brightness(1.6); }
  #pcam { flex: 1; min-width: 0; object-fit: cover; border: 3px solid #e0b341; border-radius: 18px;
          background: #222; display: none; pointer-events: none; }
  /* the sensor panel */
  #sensors { flex: 1; display: none; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 10px; color: #3fd8ff;
             font: 15px/1.3 system-ui, sans-serif; }
  #sensors .tile { position: relative; border: 2px solid #1d5d6e; border-radius: 14px; padding: 8px 10px; overflow: hidden;
                   display: flex; flex-direction: column; justify-content: center; }
  #sensors .tile b { font-size: 12px; color: #7fb7c4; font-weight: 500; }
  #sensors .tile span { font: 600 18px ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sensors .tile small { font: 500 13px ui-monospace, monospace; color: #7fb7c4; white-space: nowrap; }
  #sensors .bubble { position: absolute; right: 8px; top: 50%; width: 40px; height: 40px; margin-top: -20px; border-radius: 50%;
                     border: 2px solid #1d5d6e; }
  #sensors .bubble i { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; background: #3fd8ff; }
  #sensors .needle { position: absolute; right: 26px; top: 50%; width: 3px; height: 34px; margin-top: -17px; background: #f2766d;
                     transform-origin: 50% 50%; }
  /* the menu: a tap on the eyes shows it for a few seconds, just above the panel; the chips wrap onto a second row
     on a narrow phone, so every one shows without scrolling (the page takes every gesture for the robot) */
  #menu { position: fixed; left: 0; right: 0; display: none; flex-wrap: wrap; justify-content: center; gap: 8px;
          padding: 0 12px; box-sizing: border-box; z-index: 2; }
  #menu button { flex: none; font: 600 15px system-ui, sans-serif; color: #3fd8ff; background: rgba(0, 0, 0, 0.8);
                 border: 2px solid #1d5d6e; border-radius: 999px; padding: 9px 14px; min-height: 40px; touch-action: none; }
  #menu button.on { border-color: #3fd8ff; background: #0d3a46; }
  /* tiles (Omi Assist): big, high contrast, an icon and one word; a tile says its name when touched */
  #menu.tiles { z-index: 3; gap: 10px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); background: rgba(0, 0, 0, 0.92);
                grid-auto-rows: 1fr; flex-wrap: nowrap; }
  #menu.tiles button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
                       min-height: 0; border-radius: 20px; padding: 6px 4px; color: #fff; background: #10303a;
                       border: 3px solid #3fd8ff; font: 700 clamp(16px, 5vw, 30px)/1.1 system-ui, sans-serif; overflow: hidden; }
  #menu.tiles button i { font-style: normal; font-size: 1.7em; line-height: 1; }
  #menu.tiles button span { text-align: center; hyphens: auto; -webkit-hyphens: auto; }  /* whole words, else hyphenated */
  #menu.tiles button.on { background: #1f6a7c; border-color: #fff; }
  #menu.tiles button.flash { background: #3fd8ff; color: #000; }
  #menu.tiles button[data-mode="face"] { border-color: #ffd23f; background: #3a3210; }  /* back to the face: always last */
  #menu.tiles button.tour { background: #ffd23f; color: #000; border-color: #fff; }   /* the presentation points at it */
  /* a note (a reminder): a big card over the face, its buttons below the text */
  #card { position: fixed; inset: 0; z-index: 4; display: none; flex-direction: column; justify-content: center; gap: 24px;
          padding: 24px 18px; box-sizing: border-box; background: rgba(0, 0, 0, 0.94); color: #fff; text-align: center; }
  #card p { margin: 0; font: 700 clamp(26px, 8vw, 44px)/1.25 system-ui, sans-serif; overflow-wrap: anywhere; }
  #card div { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
  #card button { flex: 1 1 40%; min-height: 84px; font: 700 clamp(22px, 7vw, 36px) system-ui, sans-serif; border-radius: 20px;
                 border: 3px solid #33ff66; background: #0f3a1c; color: #fff; touch-action: none; }
  #card button + button { border-color: #ffcc33; background: #3a300f; }
  /* showing the picture to the PC (Omi, opt-in): always said, in red */
  #showing { left: 50%; transform: translateX(-50%); width: auto; height: auto; border-radius: 8px; padding: 4px 12px;
             background: #d02020; color: #fff; font: 700 18px system-ui, sans-serif; display: none; z-index: 5; }
  /* what a helper says, also written big for a moment (the time, the sentence being read, what it saw) */
  #toast { position: fixed; left: 12px; right: 12px; top: 40px; z-index: 3; display: none; padding: 14px 16px; border-radius: 18px;
           background: rgba(0, 0, 0, 0.88); border: 3px solid #3fd8ff; color: #fff; text-align: center;
           font: 700 clamp(22px, 7vw, 40px)/1.25 system-ui, sans-serif; overflow-wrap: anywhere; pointer-events: none; }
  #toast.above { top: 6px; padding: 8px 12px; max-height: calc(25vh - 12px); overflow: hidden;   /* the presentation: */
                 font-size: clamp(14px, 4.2vw, 22px); }                                       /* above the tiles */
  /* the magnifier (omi.js): its buttons over the picture */
  #mag { position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); display: none;
         gap: 10px; justify-content: space-between; }
  #mag button { flex: 1; min-height: 64px; font: 700 clamp(18px, 6vw, 30px) system-ui, sans-serif; border-radius: 16px;
                border: 3px solid #e0b341; background: rgba(0, 0, 0, 0.7); color: #fff; touch-action: none; }
  #mag button.on { background: #e0b341; color: #000; }
  #mag button.word { font-size: clamp(15px, 4.6vw, 22px); }   /* the camera views' "what is this?" and Zeigen */
  #panel.full { top: 0 !important; z-index: 2; }
  #panel { overflow: hidden; }  /* the magnifier's scale stays in the panel */
</style>
</head>
<body>
<canvas id="face"></canvas>
<div id="link" class="dot" title="bridge"></div>
<div id="eye" class="dot">● cam</div>
<video id="view" playsinline muted></video>
<div id="panel"><div id="pad"></div><div id="sensors"></div><video id="pcam" playsinline muted></video><div id="mag"></div></div>
<div id="menu"></div>
<div id="card"></div>
<div id="toast"></div>
<div id="showing" class="dot">● ZEIGEN</div>
<div id="start">
  <button id="go">▶</button>
  <div id="hint"></div>
  <small id="note"></small>
</div>
<script src="texts.js"></script>
<script src="face.js"></script>
<script src="see.js"></script>
<script src="omi.js"></script>
</body>
</html>
